<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Soccer League Table</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Soccer League Table</h1>

    <div class="input-section">
        <h2>Add or Edit Match Results</h2>
        <form id="match-form">
            <label for="match-id">Match ID (leave blank for new):</label>
            <input type="text" id="match-id" name="match-id" placeholder="For editing existing match" />

            <label for="teamA">Team A:</label>
            <select id="teamA" required>
                <option value="">--Select Team--</option>
                <option value="Team1">Team1</option>
                <option value="Team2">Team2</option>
                <option value="Team3">Team3</option>
                <option value="Team4">Team4</option>
                <option value="Team5">Team5</option>
            </select>

            <label for="teamB">Team B:</label>
            <select id="teamB" required>
                <option value="">--Select Team--</option>
                <option value="Team1">Team1</option>
                <option value="Team2">Team2</option>
                <option value="Team3">Team3</option>
                <option value="Team4">Team4</option>
                <option value="Team5">Team5</option>
            </select>

            <label for="scoreA">Team A Goals:</label>
            <input type="number" id="scoreA" required min="0"/>

            <label for="scoreB">Team B Goals:</label>
            <input type="number" id="scoreB" required min="0"/>

            <button type="submit">Submit Result</button>
        </form>

        <button id="reset-data" class="reset-button">Reset All Data</button>
    </div>

    <div class="table-section">
        <h2>League Table</h2>
        <table id="league-table">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Team</th>
                    <th>Played</th>
                    <th>Won</th>
                    <th>Drawn</th>
                    <th>Lost</th>
                    <th>GF</th>
                    <th>GA</th>
                    <th>GD</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div class="matches-section">
        <h2>All Matches</h2>
        <table id="matches-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Team A</th>
                    <th>Goals A</th>
                    <th>Team B</th>
                    <th>Goals B</th>
                    <th>Edit</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script src="script.js"></script>
</body>
</html>
